aid: github
url: https://raw.githubusercontent.com/api-evangelist/github/refs/heads/main/apis.yml
apis:
- aid: github:github-events-api
  name: GitHub Events API
  tags:
  - Events
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/activity/events?apiVersion=2022-11-28
  properties:
  - url: openapi/github-events-api-openapi.yml
    type: OpenAPI
  - url: https://docs.github.com/en/rest/activity/events
    type: Documentation
  description: >-
    The GitHub Events API provides a read-only feed of recent activity on GitHub, exposing structured
    event objects you can poll to see what happened across the platform or within a specific repository,
    organization, or user account. It covers many event typessuch as pushes, pull requests, issues, comments,
    releases, stars, forks, and membership changeseach with consistent metadata (actor, repo, type, payload,
    timestamps, IDs).
- aid: github:github-feeds-api
  name: GitHub Feeds API
  tags:
  - Feeds
  baseURL: https://api.github.com/
  humanURL: https://docs.github.com/en/rest/activity/feeds?apiVersion=2022-11-28
  overlays:
  - url: overlays/github-feeds-openapi-search.yml
    type: OpenAPI
  properties:
  - url: openapi/github-feeds-api-openapi.yml
    type: OpenAPI
  - url: https://docs.github.com/en/rest/activity/feeds
    type: Documentation
  description: >-
    GitHubs Feeds API lets you programmatically discover the Atom feed URLs for GitHub activity thats
    relevant to you, such as the global timeline, a specific users activity, the authenticated users public
    and private activity, organization activity, and security advisories.
- aid: github:github-gists-api
  name: GitHub Gists API
  tags:
  - Artifacts
  - Code
  - Gists
  baseURL: https://api.github.com/
  humanURL: https://docs.github.com/en/rest/gists?apiVersion=2022-11-28
  properties:
  - url: openapi/github-gists-api-openapi.yml
    type: OpenAPI
  - url: https://docs.github.com/en/rest/gists
    type: Documentation
  description: >-
    The GitHub Gists API lets you programmatically manage gistslightweight code snippets and notesover
    HTTP. You can create gists (public or secret/unlisted), read individual gists, list public gists,
    your own, a users, and those youve starred, fetch raw file contents, view version history and commits,
    update gists by adding/renaming/removing files or changing descriptions, and delete them. It also
    supports forking, starring/un-starring and checking star status, plus full CRUD for gist comments.
- aid: github:github-issues-api
  name: GitHub Issues API
  tags:
  - Issues
  baseURL: https://api.github.com/
  humanURL: https://docs.github.com/en/rest/issues?apiVersion=2022-11-28
  properties:
  - url: openapi/github-issues-api-openapi.yml
    type: OpenAPI
  - url: https://docs.github.com/en/rest/issues
    type: Documentation
  description: >-
    The GitHub Issues API lets you programmatically manage issue tracking on GitHub, enabling you to list
    and filter issues across repositories, create and edit issues, change their state (open/closed), and
    manage assignees, labels, and milestones. It supports adding, updating, and deleting comments; applying
    reactions; locking or unlocking conversations; and viewing issue events and timelines for auditing
    and automation.
- aid: github:github-licenses-api
  name: GitHub Licenses API
  tags:
  - Licenses
  baseURL: https://api.github.com/
  humanURL: https://docs.github.com/en/rest/licenses?apiVersion=2022-11-28
  properties:
  - url: openapi/github-licenses-api-openapi.yml
    type: OpenAPI
  - url: https://docs.github.com/en/rest/licenses
    type: Documentation
  description: >-
    The GitHub Licenses API lets you programmatically discover and retrieve open source license information
    across GitHub. It provides endpoints to list the common licenses GitHub supports, get detailed metadata
    and the canonical text for a specific license (by its SPDX identifier), and fetch the detected license
    for a given repository.
- aid: github:github-markdown-api
  name: GitHub Markdown API
  tags:
  - Markdown
  baseURL: https://api.github.com/
  humanURL: https://docs.github.com/en/rest/markdown?apiVersion=2022-11-28
  overlays:
  - url: overlays/github-markdown-openapi-search.yml
    type: OpenAPI
  properties:
  - url: openapi/github-markdown-api-openapi.yml
    type: OpenAPI
  - url: https://docs.github.com/en/rest/markdown
    type: Documentation
  description: >-
    The GitHub Markdown API is a REST service that converts Markdownespecially GitHub Flavored Markdowninto
    the same HTML GitHub renders in READMEs, issues, and pull requests, so external apps can display content
    consistently with GitHub.
- aid: github:github-meta-api
  name: GitHub Meta API
  tags:
  - Metadata
  baseURL: https://api.github.com/
  humanURL: https://docs.github.com/en/rest/meta?apiVersion=2022-11-28
  overlays:
  - url: overlays/github-meta-openapi-search.yml
    type: OpenAPI
  properties:
  - url: openapi/github-meta-api-openapi.yml
    type: OpenAPI
  - url: https://docs.github.com/en/rest/meta
    type: Documentation
  description: >-
    Use the REST API to get meta information about GitHub, including the IP addresses of GitHub services.
- aid: github:github-notifications-api
  name: GitHub Notifications API
  tags:
  - Notifications
  baseURL: https://api.github.com/
  humanURL: >2-

    https://docs.github.com/en/rest/activity/notifications?apiVersion=2022-11-28
  overlays:
  - url: overlays/github-notifications-openapi-search.yml
    type: OpenAPI
  properties:
  - url: openapi/github-notifications-api-openapi.yml
    type: OpenAPI
  - url: https://docs.github.com/en/rest/activity/notifications
    type: Documentation
  description: >-
    This GitHub REST API allows you to programmatically manage your GitHub notifications, which include
    updates on issues, pull requests, and commits. The API requires authentication via a personal access
    token (classic) and needs either the notifications or repo scope to function.
- aid: github:github-octocat-api
  name: GitHub Octocat API
  tags:
  - Octocat
  baseURL: https://api.github.com/
  humanURL: https://github.com/octokit/octokit.js
  overlays:
  - url: overlays/github-octocat-openapi-search.yml
    type: OpenAPI
  properties:
  - url: openapi/github-octocat-api-openapi.yml
    type: OpenAPI
  - url: https://docs.github.com/en/rest/meta/meta
    type: Documentation
  description: >-
    The GitHub Octocat API is a playful, non-functional endpoint in GitHubs REST API that returns an ASCII-art
    rendering of the Octocat mascot as plain text. Its primarily meant for fun and demospeople often use
    it to sanity-check connectivity, see how the API formats responses and headers, or showcase simple
    requests without touching real repository data. It doesnt manage or expose any GitHub resources, and
    in some clients you can even supply a short message that the Octocat says.
- aid: github:github-projects-api
  name: GitHub Projects API
  tags:
  - Projects
  baseURL: https://api.github.com/
  humanURL: https://docs.github.com/en/rest/projects?apiVersion=2022-11-28
  overlays:
  - url: overlays/github-projects-openapi-search.yml
    type: OpenAPI
  properties:
  - url: openapi/github-projects-api-openapi.yml
    type: OpenAPI
  - url: https://docs.github.com/en/rest/projects
    type: Documentation
  description: >-
    The GitHub Projects API enables developers to programmatically create and manage GitHub Projects,
    which are flexible tools for planning and tracking work using customizable boards, tables, and roadmaps.
    Through these REST API endpoints, you can create projects at the repository, organization, or user
    level, add and organize items like issues and pull requests, manage project fields and views, update
    item statuses and metadata, and automate project workflows.
- aid: github:github-repos-api
  name: GitHub Repos API
  tags:
  - Repos
  baseURL: https://api.github.com/
  humanURL: https://docs.github.com/en/rest/repos?apiVersion=2022-11-28
  overlays:
  - url: overlays/github-repos-openapi-search.yml
    type: OpenAPI
  properties:
  - url: openapi/github-repos-api-openapi.yml
    type: OpenAPI
  - url: https://docs.github.com/en/rest/repos
    type: Documentation
  description: >-
    The GitHub Repos API is a set of REST endpoints that let you programmatically create, read, update,
    and delete repositories and their resources, giving you control over a repos lifecycle and configuration.
- aid: github:github-search-api
  name: GitHub Search API
  tags:
  - Discovery
  - Search
  baseURL: https://api.github.com/
  humanURL: https://docs.github.com/en/rest/search/search?apiVersion=2022-11-28
  overlays:
  - url: overlays/github-search-openapi-search.yml
    type: OpenAPI
  properties:
  - url: openapi/github-search-api-openapi.yml
    type: OpenAPI
  - url: https://docs.github.com/en/rest/search
    type: Documentation
  description: >-
    The GitHub Search API lets you programmatically find and filter content across GitHubincluding repositories,
    code, issues and pull requests, commits, users, topics, and labelsusing a powerful query language
    with qualifiers (for example by language, stars, forks, org/user, path/filename, label, state, author,
    or committer).
- aid: github:github-user-api
  name: GitHub User API
  tags:
  - Users
  baseURL: https://api.github.com/
  humanURL: https://docs.github.com/en/rest/users?apiVersion=2022-11-28
  properties:
  - url: openapi/github-users-api-openapi.yml
    type: OpenAPI
  - url: https://docs.github.com/en/rest/users
    type: Documentation
  description: >-
    The GitHub Users API (part of the REST API) lets applications read and, for the authenticated account,
    manage user-related data on GitHub. It can fetch public profiles for any user or the authenticated
    users private profile details, list a users public repositories and organizations, and view activity
    like followers and following.
- aid: github:github-checks-api
  name: GitHub Checks API
  tags:
  - Checks
  - CI/CD
  - Status
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/checks?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/checks
    type: Documentation
  description: >-
    The GitHub Checks API lets you create and manage check runs and check suites that report detailed
    status, annotations, and results for commits. It enables CI/CD tools and integrations to report build
    and test results directly on pull requests with rich output including summaries, text, images, and
    per-line annotations.
- aid: github:github-deployments-api
  name: GitHub Deployments API
  tags:
  - Deployments
  - Releases
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/deployments?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/deployments
    type: Documentation
  description: >-
    The GitHub Deployments API lets you create and manage deployments and deployment statuses for repositories.
    Deployments are requests to deploy a specific ref (branch, SHA, tag) to an environment, and deployment
    statuses track the progress of that deployment. The API also supports managing deployment environments,
    environment protection rules, and deployment branch policies.
- aid: github:github-releases-api
  name: GitHub Releases API
  tags:
  - Distribution
  - Releases
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/releases?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/releases
    type: Documentation
  description: >-
    The GitHub Releases API lets you create, edit, and delete releases for a repository, as well as upload
    and manage release assets (binaries, installers, archives). Releases are based on Git tags and provide
    a way to package and distribute software versions with release notes, pre-release flags, and downloadable
    assets.
- aid: github:github-pages-api
  name: GitHub Pages API
  tags:
  - Hosting
  - Pages
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/pages?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/pages
    type: Documentation
  description: >-
    The GitHub Pages API lets you manage GitHub Pages sites for repositories, including creating, updating,
    and deleting sites, configuring custom domains and HTTPS enforcement, and triggering and monitoring
    Pages builds. GitHub Pages hosts static websites directly from a repository branch or GitHub Actions
    workflow.
- aid: github:github-packages-api
  name: GitHub Packages API
  tags:
  - Packages
  - Registry
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/packages?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/packages
    type: Documentation
  description: >-
    The GitHub Packages API lets you manage packages and package versions in GitHub Packages, a software
    package hosting service that supports npm, Maven, Gradle, RubyGems, NuGet, Docker, and other package
    formats. The API provides endpoints to list, get, delete, and restore packages and their versions
    at the user, organization, and repository level.
- aid: github:github-git-database-api
  name: GitHub Git Database API
  tags:
  - Database
  - Git
  - Source Control
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/git?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/git
    type: Documentation
  description: >-
    The GitHub Git Database API provides low-level access to Git objects (blobs, commits, refs, tags,
    and trees) in a repository. It lets you read and write raw Git data directly, enabling operations
    like creating commits programmatically, building trees, reading blob contents, and managing references
    without using the higher-level repository content endpoints.
- aid: github:github-codespaces-api
  name: GitHub Codespaces API
  tags:
  - Codespaces
  - Development Environments
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/codespaces?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/codespaces
    type: Documentation
  description: >-
    The GitHub Codespaces API lets you create, manage, start, stop, and delete cloud development environments
    (codespaces) for repositories. It provides endpoints for managing codespace secrets, machine types,
    dev container configurations, and organization-level codespace policies and billing.
- aid: github:github-copilot-api
  name: GitHub Copilot API
  tags:
  - AI
  - Copilot
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/copilot?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/copilot
    type: Documentation
  description: >-
    The GitHub Copilot API lets organization and enterprise owners manage GitHub Copilot seat assignments,
    retrieve usage metrics and billing information, and configure Copilot policies. It provides endpoints
    to add and remove Copilot seats for members, list assigned seats, and access Copilot usage data for
    reporting and administration.
- aid: github:github-billing-api
  name: GitHub Billing API
  tags:
  - Billing
  - Usage
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/billing?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/billing
    type: Documentation
  description: >-
    The GitHub Billing API lets you view billing and usage information for organizations and enterprises,
    including Actions minutes, Packages storage and data transfer, Codespaces usage, and shared storage
    consumption. It provides endpoints for retrieving current usage summaries and managing billing budgets
    and thresholds.
- aid: github:github-migrations-api
  name: GitHub Migrations API
  tags:
  - Export
  - Import
  - Migrations
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/migrations?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/migrations
    type: Documentation
  description: >-
    The GitHub Migrations API lets you migrate data to and from GitHub. It supports organization migrations
    that export repositories and metadata as downloadable archives, source imports that convert repositories
    from Subversion, Mercurial, or TFS to Git, and user migrations for moving personal repositories between
    accounts or platforms.
- aid: github:github-secret-scanning-api
  name: GitHub Secret Scanning API
  tags:
  - Secret Scanning
  - Security
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/secret-scanning?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/secret-scanning
    type: Documentation
  description: >-
    The GitHub Secret Scanning API lets you retrieve and manage secret scanning alerts for repositories,
    organizations, and enterprises. Secret scanning detects tokens, keys, and other credentials accidentally
    committed to repositories. The API provides endpoints to list, get, and update alert statuses, as
    well as manage push protection bypass requests and list alert locations.
- aid: github:github-security-advisories-api
  name: GitHub Security Advisories API
  tags:
  - Advisories
  - Security
  - Vulnerabilities
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/security-advisories?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/security-advisories
    type: Documentation
  description: >-
    The GitHub Security Advisories API lets you view and manage security advisories for repositories and
    access the GitHub Advisory Database. It provides endpoints to create, update, and list repository
    security advisories, request CVE identifiers, and query the global advisory database for known vulnerabilities
    across the open source ecosystem.
- aid: github:github-commits-api
  name: GitHub Commits API
  tags:
  - Commits
  - Source Control
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/commits?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/commits
    type: Documentation
  description: >-
    The GitHub Commits API lets you list, retrieve, and compare commits in a repository, as well as manage
    commit comments and commit statuses. It provides endpoints for viewing commit details, listing pull
    requests associated with a commit, getting the combined status for a ref, and creating status checks
    that report build or test results.
- aid: github:github-reactions-api
  name: GitHub Reactions API
  tags:
  - Reactions
  - Social
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/reactions?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/reactions
    type: Documentation
  description: >-
    The GitHub Reactions API lets you create, list, and delete emoji reactions on issues, pull requests,
    issue comments, pull request review comments, commit comments, release assets, and team discussion
    posts. Supported reaction types include thumbs up/down, laugh, confused, heart, hooray, rocket, and
    eyes.
- aid: github:github-deploy-keys-api
  name: GitHub Deploy Keys API
  tags:
  - Deploy Keys
  - Security
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/deploy-keys?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/deploy-keys
    type: Documentation
  description: >-
    The GitHub Deploy Keys API lets you manage deploy keys for repositories. Deploy keys are SSH keys
    that grant read-only or read-write access to a single repository, commonly used for automated deployment
    systems and CI/CD pipelines that need to clone or push to a specific repository without using a personal
    account.
- aid: github:github-dependency-graph-api
  name: GitHub Dependency Graph API
  tags:
  - Dependencies
  - Security
  - Supply Chain
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/dependency-graph?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/dependency-graph
    type: Documentation
  description: >-
    The GitHub Dependency Graph API lets you view and submit dependency information for a repository.
    It provides endpoints to export the software bill of materials (SBOM) for a repository and to submit
    dependency snapshots from build tools or package managers, enabling GitHub to generate Dependabot
    alerts for vulnerable dependencies.
- aid: github:github-metrics-api
  name: GitHub Metrics API
  tags:
  - Analytics
  - Metrics
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/metrics?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/metrics
    type: Documentation
  description: >-
    The GitHub Metrics API lets you access community profile and repository statistics, including contributor
    activity, commit frequency, code frequency, participation data, punch card data, and community health
    metrics. It helps developers and maintainers understand project activity patterns and community engagement.
- aid: github:github-interactions-api
  name: GitHub Interactions API
  tags:
  - Interactions
  - Moderation
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/interactions?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/interactions
    type: Documentation
  description: >-
    The GitHub Interactions API lets you temporarily restrict which users can comment, open issues, or
    create pull requests in public repositories. It supports setting interaction limits at the repository,
    organization, or authenticated user level, restricting interactions to existing users, contributors,
    or collaborators for a specified duration.
- aid: github:github-models-api
  name: GitHub Models API
  tags:
  - AI
  - Machine Learning
  - Models
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/models?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/models
    type: Documentation
  description: >-
    The GitHub Models API provides access to the GitHub Models catalog, letting you list and retrieve
    details about AI models available on the GitHub platform. It supports browsing model metadata including
    names, descriptions, publishers, and capabilities, enabling integration with AI model discovery and
    selection workflows.
- aid: github:github-graphql-api
  name: GitHub GraphQL API
  tags:
  - GraphQL
  - Query Language
  baseURL: https://api.github.com/graphql
  humanURL: https://docs.github.com/en/graphql
  properties:
  - url: https://docs.github.com/en/graphql
    type: Documentation
  - url: https://docs.github.com/en/graphql/reference
    type: Reference
  - url: graphql/github-graphql.md
    type: GraphQL
  description: >-
    The GitHub GraphQL API provides a flexible query language for accessing GitHub data, allowing clients
    to request exactly the fields they need in a single request. It supports queries, mutations, and subscriptions
    across all GitHub resources including repositories, issues, pull requests, users, organizations, and
    projects, and is the recommended API for new integrations that need precise data fetching.
- aid: github:github-campaigns-api
  name: GitHub Campaigns API
  tags:
  - Campaigns
  - Security
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/campaigns?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/campaigns
    type: Documentation
  description: >-
    The GitHub Campaigns API lets organization owners and security managers create and manage security
    campaigns that coordinate remediation of code scanning alerts across multiple repositories. It provides
    endpoints to list, create, get, update, and delete campaigns, each of which tracks alert statistics
    including open, closed, and in-progress items, and supports assigning campaign managers from both
    users and teams.
- aid: github:github-classroom-api
  name: GitHub Classroom API
  tags:
  - Classroom
  - Education
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/classroom?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/classroom
    type: Documentation
  description: >-
    The GitHub Classroom API lets you programmatically interact with GitHub Classroom, providing endpoints
    to list classrooms, get classroom details, list assignments for a classroom, get assignment details,
    list accepted assignments for students, and retrieve assignment grades. It is useful for educational
    administrators and tooling that needs to manage or report on classroom data and student submissions.
- aid: github:github-code-security-api
  name: GitHub Code Security API
  tags:
  - Code Security
  - Configurations
  - Security
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/code-security?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/code-security
    type: Documentation
  description: >-
    The GitHub Code Security API lets organizations and enterprises create and manage reusable code security
    configurations that standardize security settings across repositories. It provides endpoints to create,
    retrieve, update, and delete configurations, set defaults, and attach or detach configurations from
    repositories at both the organization and enterprise level.
- aid: github:github-credentials-api
  name: GitHub Credentials API
  tags:
  - Authentication
  - Credentials
  - Security
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/credentials?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/credentials
    type: Documentation
  description: >-
    The GitHub Credentials API lets you programmatically manage authentication credentials, providing
    endpoints to revoke a list of credentials such as tokens and keys for security purposes. It enables
    automated credential lifecycle management and bulk revocation when credentials need to be invalidated.
- aid: github:github-enterprise-teams-api
  name: GitHub Enterprise Teams API
  tags:
  - Enterprise
  - Teams
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/enterprise-teams?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/enterprise-teams
    type: Documentation
  description: >-
    The GitHub Enterprise Teams API lets enterprise owners create and manage enterprise-level teams. It
    provides endpoints to list, create, get, update, and delete teams, manage team membership including
    bulk additions and removals, and assign teams to specific organizations within the enterprise.
- aid: github:github-private-registries-api
  name: GitHub Private Registries API
  tags:
  - Packages
  - Registries
  baseURL: https://api.github.com
