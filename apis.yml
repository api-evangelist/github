- aid: github:github-starring-api
  name: GitHub Starring API
  tags:
  - Activity
  - Starring
  baseURL: https://api.github.com
  humanURL: https://docs.github.com/en/rest/activity/starring?apiVersion=2022-11-28
  properties:
  - url: https://docs.github.com/en/rest/activity/starring
    type: Documentation
  description: >-
    The GitHub Starring API lets you bookmark repositories and manage your starred list. It provides endpoints
    to list stargazers for a repository, list repositories starred by the authenticated user or a specific
    user, check if a repository is starred, and star or unstar a repository. It supports a custom media
    type that includes a timestamp of when the star was created.
- aid: github:github-watching-api
  name: GitHub Watching API
  tags:
  - Activity
