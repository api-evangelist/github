    - name: Unlimited Public Repositories
      description: >-
        Host open source projects in public GitHub repositories, accessible via web or command line. Public
        repositories are accessible to anyone at GitHub.com.
    - name: Unlimited Private Repositories
      description: >-
        Host open source projects in public GitHub repositories, accessible via web or command line. Public
        repositories are accessible to anyone at GitHub.com.
    - name: Dependabot Security Updates
      description: >-
        Keep projects secure by automatically opening pull requests to update vulnerable dependencies and keep
        them up to date.
    - name: Dependabot Version Updates
      description: >-
        Keep projects secure by automatically opening pull requests to update vulnerable dependencies and keep
        them up to date.
    - name: Issues
      description: >-
        Give your developers flexible features for project management that adapts to any team, project, and
        workflow  all alongside your code.
    - name: Projects
      description: >-
        Give your developers flexible features for project management that adapts to any team, project, and
        workflow  all alongside your code.
    - name: Community Support
      description: Get help with most of your GitHub questions and issues in our Community Forum.
    - name: Access to GitHub Codespaces
      description: >-
        Blazing fast cloud developer environments with flexible compute and pre-configured containers, developers
        can code, collaborate, and debug from any browser. Pay only for what you use with compute fees starting at
        $0.18/hr and storage fees at $0.07/GB per month.
    - name: Protected Branches
      description: >-
        Enforce restrictions on how code branches are merged, including requiring reviews by selected
        collaborators, or allowing only specific contributors to work on a particular branch.
    - name: Multiple Reviewers in Pull Requests
      description: Assign multiple users or a team to review a pull request.
    - name: Draft Pull Requests
      description: Easily discuss and collaborate on pull requests before submitting to formal review.
    - name: Code Owners
      description: >-
        Automatically request reviewsor require approvalby selected contributors when changes are made to sections
        of code that they own.
    - name: Required Reviewers
      description: >-
        Ensure that pull requests have a specific number of approving reviews before collaborators can make
        changes to a protected branch.
    - name: Pages & Wikis
      description: >-
        Host documentation and simple websites for your project in a wiki format that contributors can easily edit
        either on the web or command line.
    - name: Environmental Deployment Branches and Secrets
      description: >-
        A job cannot access secrets that are defined in an environment unless it is running on the specified
        branch.
    - name: Data Residency
      description: >-
        GitHub Enterprise Cloud offers a multi-tenant enterprise SaaS solution on Microsoft Azure, allowing you to
        choose a regional cloud deployment for data residency, so your in-scope data is stored at rest in a
        designated location. Start a free 30 day trial today or contact our sales team for more information.
    - name: Managed Users
      description: Own and control the user accounts of your enterprise members through your identity provider (IdP).
    - name: User Provisioning Through SCIM
      description: >-
        Automatically invite members to join your organization when you grant access on your IdP. If you remove a
        member's access to your GitHub organization on your SAML IdP, the member will be automatically removed
        from the GitHub organization.
    - name: Centrall Manage Multiple Organizations
      description: >-
        GitHub Enterprise Cloud includes the option to create an enterprise account, which enables collaboration
        between multiple organizations, gives administrators a single point of visibility and management and
        brings license cost savings for identical users in multiple organizations
    - name: Environment Protection Rules
      description: >-
        When a workflow job references an environment, the job won't start until all of the environment's
        protection rules pass.
    - name: Repository Rules
      description: >-
        Enforce branch and tag restrictions across your organization, ensuring branch and tag protection across
        your repositories. Evaluate rules to assess impact before enforcement.
    - name: Audit Log API
      description: >-
        As a GitHub Enterprise Cloud organization administrator, you can now access log events using our GraphQL
        API and monitor the activity in your organization.
    - name: Annual SOC Reports
      description: >-
        GitHub offers AICPA System and Organization Controls (SOC) 1 Type 2 and SOC 2 Type 2 reports with IAASB
        International Standards on Assurance Engagements, ISAE 3000, and ISAE 3402.
    - name: FedRAMP
      description: >-
        Government users can host projects on GitHub Enterprise Cloud with the confidence that our platform meets
        the low impact software-as-a-service (SaaS) baseline of security standards set by our U.S. federal
        government partners.
    - name: SAML Single Sign-On
      description: Use an identity provider to manage the identities of GitHub users and applications.
    - name: Advanced Auditing
      description: >-
        Quickly review the actions performed by members of your organization. Keep copies of audit log data to
        ensure secure IP and maintain compliance for your organization.
    - name: GitHub Connect
      description: Share features and workflows between your GitHub Enterprise Server instance and GitHub Enterprise Cloud.
    description: Security, compliance, and flexible deployment
