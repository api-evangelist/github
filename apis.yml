  properties:
  - url: https://docs.github.com/en/rest/activity/watching
    type: Documentation
  description: >-
    The GitHub Watching API lets you subscribe to notifications for activity in a repository. It provides
    endpoints to list watchers of a repository, get and set a repository subscription, delete a subscription,
    and list repositories watched by the authenticated user or a specific user. Watching a repository
    means you receive notifications for new issues, pull requests, and other activity.
