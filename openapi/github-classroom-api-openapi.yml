      name: assignment_id
      description: The unique identifier of the classroom assignment.
      in: path
      required: true
      schema:
        type: integer
  responses:
    gone:
      description: Gone
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/basic-error'
  schemas:
    basic-error:
      title: Basic Error
      description: Basic Error
      type: object
      properties:
