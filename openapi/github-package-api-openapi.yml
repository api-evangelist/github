          format: date-time
          example: '2011-01-26T19:06:43Z'
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2011-01-26T19:01:12Z'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2011-01-26T19:14:43Z'
        permissions:
          type: object
