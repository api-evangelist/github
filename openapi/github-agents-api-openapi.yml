          - SECRET_TOKEN
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - name
      - created_at
      - updated_at
    actions-variable:
      title: Actions Variable
      type: object
      properties:
        name:
          description: The name of the variable.
          type: string
          examples:
          - USERNAME
        value:
          description: The value of the variable.
          type: string
          examples:
          - octocat
        created_at:
          description: The date and time at which the variable was created, in ISO 8601 format':' YYYY-MM-DDTHH:MM:SSZ.
          type: string
          format: date-time
          examples:
          - '2019-01-24T22:45:36.000Z'
        updated_at:
          description: The date and time at which the variable was last updated, in ISO 8601 format':' YYYY-MM-DDTHH:MM:SSZ.
          type: string
          format: date-time
          examples:
          - '2019-01-24T22:45:36.000Z'
      required:
      - name
      - value
      - created_at
      - updated_at
