          format: uri
          example: https://api.github.com/repos/octocat/Hello-World
        teams_url:
          type: string
          format: uri
          example: https://api.github.com/repos/octocat/Hello-World
        apps_url:
          type: string
          format: uri
          example: https://api.github.com/repos/octocat/Hello-World
        users:
          type: array
