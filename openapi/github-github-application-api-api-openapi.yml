    enterprise-webhooks:
      title: Enterprise
      description: 'An enterprise on GitHub. Webhook payloads contain the `enterprise` property when the webhook is configured

        on an enterprise account or an organization that''s part of an enterprise account. For more information,

        see "[About enterprise accounts](https://docs.github.com/enterprise-server@3.9/admin/overview/about-enterprise-accounts)."

        '
      type: object
      properties:
        description:
          description: A short description of the enterprise.
          type:
          - string
          - 'null'
          example: This is an example repository
        html_url:
          type: string
          format: uri
          example: https://github.com/enterprises/octo-business
        website_url:
          description: The enterprise's website URL.
          type:
          - string
          - 'null'
          format: uri
          example: https://api.github.com/repos/octocat/Hello-World
        id:
          description: Unique identifier of the enterprise
          example: 42
          type: integer
        node_id:
          type: string
          example: MDEwOlJlcG9zaXRvcnkxMjk2MjY5
        name:
          description: The name of the enterprise.
          type: string
          example: Octo Business
        slug:
          description: The slug url identifier for the enterprise.
          type: string
          example: octo-business
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2019-01-26T19:01:12Z'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2019-01-26T19:14:43Z'
        avatar_url:
          type: string
          format: uri
          example: https://api.github.com/repos/octocat/Hello-World
      required:
      - id
      - node_id
      - name
      - slug
      - html_url
      - created_at
      - updated_at
      - avatar_url
