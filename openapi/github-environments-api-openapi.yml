          type: array
          description: Built-in deployment protection rules for the environment.
          items:
            anyOf:
            - type: object
              properties:
                id:
                  type: integer
                  example: 3515
                node_id:
                  type: string
                  example: MDQ6R2F0ZTM1MTU=
                type:
                  type: string
