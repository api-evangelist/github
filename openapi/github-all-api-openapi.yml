openapi: 3.2.0
info:
  title: Github All API
  version: 1.1.4
  license:
    name: MIT
    url: https://spdx.org/licenses/MIT
  termsOfService: https://docs.github.com/articles/github-terms-of-service
  description: 'Operations tagged All across 10 of this provider''s published API definitions: github-code-of-conduct-api-openapi.yml, github-manage-openapi.yml, github-organizations-openapi.yml, github-repo-actions-api-openapi.yml, github-repo-autolinks-api-openapi.yml, github-repo-branches-api-openapi.yml, github-repo-issues-api-openapi.yml, github-repo-pulls-api-openapi.yml, github-repo-tags-api-openapi.yml, github-setup-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: '{protocol}://{hostname}/api/v3'
  variables:
    hostname:
      description: Self-hosted Enterprise Server hostname
      default: HOSTNAME
    protocol:
      description: Self-hosted Enterprise Server protocol
      default: http
- url: '{protocol}://{hostname}'
  variables:
    hostname:
      description: Self-hosted Enterprise Server hostname
      default: api.github.com
    protocol:
      description: Self-hosted Enterprise Server protocol
      default: https
tags:
- name: All
paths:
  /codes_of_conduct:
    get:
      summary: GitHub Get All Codes of Conduct
      description: The GitHub Code of Conduct API endpoint `/codes_of_conduct` with the GET method retrieves all available codes of conduct that can be applied to repositories on GitHub. This operation returns a list of codes of conduct templates that organizations and repository owners can use to establish community guidelines and behavioral expectations for their projects. Each code of conduct in the response typically includes metadata such as a unique key identifier, name, and URL where the full text can be accessed, allowing developers to programmatically discover and reference GitHub's standardized codes of conduct for implementation in their repositories.
      tags:
      - All
      operationId: getAllCodesOfConduct
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/enterprise-server@3.9/rest/codes-of-conduct/codes-of-conduct#get-all-codes-of-conduct
      parameters: []
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/code-of-conduct'
              examples:
                default:
                  $ref: '#/components/examples/code-of-conduct-simple-items'
        '304':
          $ref: '#/components/responses/not_modified'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: codes-of-conduct
        subcategory: codes-of-conduct
      security:
      - bearerHttpAuthentication: []
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    servers:
    - url: '{protocol}://{hostname}/api/v3'
      variables:
        hostname:
          description: Self-hosted Enterprise Server hostname
          default: HOSTNAME
        protocol:
          description: Self-hosted Enterprise Server protocol
          default: http
  /manage/v1/config/nodes:
    get:
      summary: GitHub Get Ghes Node Metadata for All Nodes
      description: Get node metadata for all configured nodes in the current cluster. For more information, see "[About clustering](https://docs.github.com/enterprise-server@3.9/admin/enterprise-management/configuring-clustering/about-clustering)."
      operationId: getGhesNodeMetadataForAllNodes
      tags:
      - All
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/enterprise-server@3.9/rest/enterprise-admin/manage-ghes#get-ghes-node-metadata-for-all-nodes
      servers:
      - url: '{protocol}://{hostname}'
        variables:
          hostname:
            default: HOSTNAME
            description: Self-hosted Enterprise Server hostname
          protocol:
            default: http
            description: Self-hosted Enterprise Server protocol
      parameters:
      - $ref: '#/components/parameters/uuid'
      - $ref: '#/components/parameters/cluster-roles'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ghes-config-nodes'
              examples:
                default:
                  $ref: '#/components/examples/ghes-config-nodes'
        '401':
          description: Unauthorized
        '500':
          description: Internal error
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: false
        category: enterprise-admin
        subcategory: manage-ghes
      security:
      - bearerHttpAuthentication: []
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    servers:
    - url: '{protocol}://{hostname}/api/v3'
      variables:
        hostname:
          description: Self-hosted Enterprise Server hostname
          default: HOSTNAME
        protocol:
          description: Self-hosted Enterprise Server protocol
          default: http
  /manage/v1/replication/status:
    get:
      summary: GitHub Get the Status of Services Running on All Replica Nodes
      description: 'Gets the status of all services running on each replica node.

        This endpoint may take several seconds to reply.'
      operationId: getTheStatusOfServicesRunningOnAllReplicaNodes
      tags:
      - All
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/enterprise-server@3.9/rest/enterprise-admin/manage-ghes#get-the-status-of-services-running-on-all-replica-nodes
      servers:
      - url: '{protocol}://{hostname}'
        variables:
          hostname:
            default: HOSTNAME
            description: Self-hosted Enterprise Server hostname
          protocol:
            default: http
            description: Self-hosted Enterprise Server protocol
      parameters:
      - $ref: '#/components/parameters/uuid'
      - $ref: '#/components/parameters/cluster-roles'
      responses:
