    check-suite:
      title: CheckSuite
      description: A suite of checks performed on the code of a given code change
      type: object
      properties:
        id:
          type: integer
          example: 5
        node_id:
          type: string
          example: MDEwOkNoZWNrU3VpdGU1
        head_branch:
          type:
          - string
          - 'null'
          example: master
        head_sha:
          description: The SHA of the head commit that is being checked.
          example: 009b8a3a9ccbb128af87f9b1c0f4c62e8a304f6d
          type: string
        status:
          type:
          - string
          - 'null'
          example: completed
          enum:
          - queued
          - in_progress
          - completed
        conclusion:
          type:
          - string
          - 'null'
          example: neutral
          enum:
          - success
          - failure
          - neutral
          - cancelled
          - skipped
          - timed_out
          - action_required
          - startup_failure
          - stale
          - null
        url:
          type:
          - string
          - 'null'
          example: https://api.github.com/repos/github/hello-world/check-suites/5
        before:
          type:
          - string
          - 'null'
          example: 146e867f55c26428e5f9fade55a9bbf5e95a7912
        after:
          type:
          - string
          - 'null'
          example: d6fde92930d4715a2b49857d24b940956b26d2d3
        pull_requests:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/pull-request-minimal'
        app:
          $ref: '#/components/schemas/nullable-integration'
        repository:
          $ref: '#/components/schemas/minimal-repository'
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-04-17T12:00:00Z'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-04-17T12:00:00Z'
        head_commit:
          $ref: '#/components/schemas/simple-commit'
        latest_check_runs_count:
          type: integer
          example: 42
        check_runs_url:
          type: string
          example: https://api.github.com/repos/octocat/Hello-World
        rerequestable:
          type: boolean
          example: true
        runs_rerequestable:
          type: boolean
          example: true
      required:
      - id
      - node_id
      - head_branch
      - status
      - conclusion
      - head_sha
      - url
      - before
      - after
      - created_at
      - updated_at
      - app
      - head_commit
      - repository
      - latest_check_runs_count
      - check_runs_url
      - pull_requests
