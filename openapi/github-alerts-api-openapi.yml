components:
  parameters:
    secret-scanning-alert-secret-type:
      name: secret_type
      in: query
      description: 'A comma-separated list of secret types to return. By default all secret types are returned.

        See "[Secret scanning patterns](https://docs.github.com/enterprise-server@3.9/code-security/secret-scanning/secret-scanning-patterns#supported-secrets-for-advanced-security)"

        for a complete list of secret types.'
      required: false
      schema:
        type: string
    per-page:
      name: per_page
      description: The number of results per page (max 100). For more information, see "[Using pagination in the REST API](https://docs.github.com/enterprise-server@3.9/rest/using-the-rest-api/using-pagination-in-the-rest-api)."
      in: query
      schema:
        type: integer
        default: 30
    direction:
      name: direction
      description: The direction to sort the results by.
      in: query
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
        default: desc
    dependabot-alert-comma-separated-states:
      name: state
      in: query
      description: 'A comma-separated list of states. If specified, only alerts with these states will be returned.


        Can be: `auto_dismissed`, `dismissed`, `fixed`, `open`'
      schema:
        type: string
    pagination-before:
      name: before
      description: A cursor, as given in the [Link header](https://docs.github.com/enterprise-server@3.9/rest/guides/using-pagination-in-the-rest-api#using-link-headers). If specified, the query only searches for results before this cursor. For more information, see "[Using pagination in the REST API](https://docs.github.com/enterprise-server@3.9/rest/using-the-rest-api/using-pagination-in-the-rest-api)."
      in: query
      required: false
      schema:
        type: string
    secret-scanning-alert-resolution:
      name: resolution
      in: query
      description: A comma-separated list of resolutions. Only secret scanning alerts with one of these resolutions are listed. Valid resolutions are `false_positive`, `wont_fix`, `revoked`, `pattern_edited`, `pattern_deleted` or `used_in_tests`.
      required: false
      schema:
        type: string
    dependabot-alert-comma-separated-severities:
      name: severity
      in: query
      description: 'A comma-separated list of severities. If specified, only alerts with these severities will be returned.


        Can be: `low`, `medium`, `high`, `critical`'
      schema:
        type: string
    org:
      name: org
      description: The organization name. The name is not case sensitive.
      in: path
      required: true
      schema:
        type: string
    secret-scanning-alert-sort:
      name: sort
      description: The property to sort the results by. `created` means when the alert was created. `updated` means when the alert was updated or resolved.
      in: query
      required: false
      schema:
        type: string
        enum:
        - created
        - updated
        default: created
    pagination-after:
      name: after
      description: A cursor, as given in the [Link header](https://docs.github.com/enterprise-server@3.9/rest/guides/using-pagination-in-the-rest-api#using-link-headers). If specified, the query only searches for results after this cursor. For more information, see "[Using pagination in the REST API](https://docs.github.com/enterprise-server@3.9/rest/using-the-rest-api/using-pagination-in-the-rest-api)."
      in: query
      required: false
      schema:
        type: string
    dependabot-alert-comma-separated-ecosystems:
      name: ecosystem
      in: query
      description: 'A comma-separated list of ecosystems. If specified, only alerts for these ecosystems will be returned.


        Can be: `composer`, `go`, `maven`, `npm`, `nuget`, `pip`, `pub`, `rubygems`, `rust`'
      schema:
        type: string
    pagination-first:
      name: first
      description: '**Deprecated**. The number of results per page (max 100), starting from the first matching result.

        This parameter must not be used in combination with `last`.

        Instead, use `per_page` in combination with `after` to fetch the first page of results.'
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    tool-name:
      name: tool_name
      description: The name of a code scanning tool. Only results by this tool will be listed. You can specify the tool by using either `tool_name` or `tool_guid`, but not both.
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/code-scanning-analysis-tool-name'
    dependabot-alert-scope:
      name: scope
      in: query
      description: The scope of the vulnerable dependency. If specified, only alerts with this scope will be returned.
      schema:
        type: string
        enum:
        - development
        - runtime
    secret-scanning-pagination-before-org-repo:
      name: before
      description: A cursor, as given in the [Link header](https://docs.github.com/enterprise-server@3.9/rest/guides/using-pagination-in-the-rest-api#using-link-headers). If specified, the query only searches for events before this cursor. To receive an initial cursor on your first request, include an empty "before" query string.
      in: query
      required: false
      schema:
        type: string
    secret-scanning-pagination-after-org-repo:
      name: after
      description: A cursor, as given in the [Link header](https://docs.github.com/enterprise-server@3.9/rest/guides/using-pagination-in-the-rest-api#using-link-headers). If specified, the query only searches for events after this cursor.  To receive an initial cursor on your first request, include an empty "after" query string.
      in: query
      required: false
      schema:
        type: string
    pagination-last:
      name: last
      description: '**Deprecated**. The number of results per page (max 100), starting from the last matching result.

        This parameter must not be used in combination with `first`.

        Instead, use `per_page` in combination with `before` to fetch the last page of results.'
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    page:
      name: page
      description: The page number of the results to fetch. For more information, see "[Using pagination in the REST API](https://docs.github.com/enterprise-server@3.9/rest/using-the-rest-api/using-pagination-in-the-rest-api)."
      in: query
      schema:
        type: integer
        default: 1
    secret-scanning-alert-state:
      name: state
      in: query
      description: Set to `open` or `resolved` to only list secret scanning alerts in a specific state.
      required: false
      schema:
        type: string
        enum:
        - open
        - resolved
    dependabot-alert-comma-separated-packages:
      name: package
      in: query
      description: A comma-separated list of package names. If specified, only alerts for these packages will be returned.
      schema:
        type: string
    tool-guid:
      name: tool_guid
      description: The GUID of a code scanning tool. Only results by this tool will be listed. Note that some code scanning tools may not include a GUID in their analysis data. You can specify the tool by using either `tool_guid` or `tool_name`, but not both.
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/code-scanning-analysis-tool-guid'
    dependabot-alert-sort:
      name: sort
      in: query
      description: 'The property by which to sort the results.

        `created` means when the alert was created.

        `updated` means when the alert''s state last changed.'
      schema:
        type: string
        enum:
        - created
        - updated
        default: created
    alert-number:
      name: alert_number
      in: path
      description: The number that identifies an alert. You can find this at the end of the URL for a code scanning alert within GitHub, and in the `number` field in the response from the `GET /repos/{owner}/{repo}/code-scanning/alerts` operation.
      required: true
      schema:
        $ref: '#/components/schemas/alert-number'
    repo:
      name: repo
      description: The name of the repository without the `.git` extension. The name is not case sensitive.
      in: path
      required: true
      schema:
        type: string
    git-ref:
      name: ref
      description: The Git reference for the results you want to list. The `ref` for a branch can be formatted either as `refs/heads/<branch name>` or simply `<branch name>`. To reference a pull request use `refs/pull/<number>/merge`.
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/code-scanning-ref'
    owner:
      name: owner
      description: The account owner of the repository. The name is not case sensitive.
      in: path
      required: true
      schema:
        type: string
    pagination-before_2:
      name: before
      description: cursor, as given in the [Link header](https://docs.github.com/enterprise-server@3.9/rest/guides/using-pagination-in-the-rest-api#using-link-headers). If specified, the query only searches for results before this cursor. For more information, see "[Using pagination in the REST API](https://docs.github.com/enterprise-server@3.9/rest/using-the-rest-api/using-pagination-in-the-rest-api)."
      in: query
