    blob:
      title: Blob
      description: Blob
      type: object
      properties:
        content:
          type: string
          example: example_value
        encoding:
          type: string
          example: example_value
        url:
          type: string
          format: uri
          example: https://api.github.com/repos/octocat/Hello-World
        sha:
          type: string
          example: abc123def456789012345678901234567890
        size:
          type:
          - integer
          - 'null'
          example: 42
        node_id:
          type: string
          example: '12345678'
        highlighted_content:
