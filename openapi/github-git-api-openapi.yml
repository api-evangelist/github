        status:
          type: string
          example: open
    verification:
      title: Verification
      type: object
      properties:
        verified:
          type: boolean
          example: true
        reason:
          type: string
          example: example_value
        payload:
          type:
          - string
          - 'null'
          example: example_value
        signature:
          type:
          - string
          - 'null'
          example: example_value
      required:
      - verified
      - reason
      - payload
      - signature
    short-blob:
      title: Short Blob
      description: Short Blob
      type: object
      properties:
        url:
          type: string
          example: https://api.github.com/repos/octocat/Hello-World
        sha:
          type: string
          example: abc123def456789012345678901234567890
      required:
      - url
