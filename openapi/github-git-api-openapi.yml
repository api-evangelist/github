    check-suite:
      title: CheckSuite
      description: suite of checks performed on the code of a given code change
      type: object
      properties:
        id:
          type: integer
          example: 5
        node_id:
          type: string
          example: MDEwOkNoZWNrU3VpdGU1
        head_branch:
          type: string
          example: master
        head_sha:
          description: The SHA of the head commit that is being checked.
          example: 009b8a3a9ccbb128af87f9b1c0f4c62e8a304f6d
          type: string
        status:
          type: string
          description: The phase of the lifecycle that the check suite is currently in. Statuses of waiting, requested, and pending are reserved for GitHub Actions check suites.
          example: completed
          enum:
          - queued
          - in_progress
          - completed
          - waiting
          - requested
          - pending
        conclusion:
          type: string
          example: neutral
          enum:
          - success
          - failure
          - neutral
          - cancelled
          - skipped
          - timed_out
          - action_required
          - startup_failure
          - stale
          - null
        url:
          type: string
          example: https://api.github.com/repos/github/hello-world/check-suites/5
        before:
          type: string
          example: 146e867f55c26428e5f9fade55a9bbf5e95a7912
        after:
          type: string
          example: d6fde92930d4715a2b49857d24b940956b26d2d3
        pull_requests:
          type: array
