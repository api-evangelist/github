    pull-request-merge-async-result:
      title: Pull Request Merge Async Result
      description: Pull Request Merge Async Result
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - pending
          - merged
          - enqueued
          - failed
        details:
          anyOf:
          - description: When the asynchronous merge request is pending
            type: object
            additionalProperties: false
            properties:
              message:
                type: string
              uuid:
                type: string
              merge_method:
                type: string
                enum:
                - default
                - merge
                - squash
                - rebase
              merge_action:
                type: string
                enum:
                - default
                - merge_queue
                - direct_merge
              expected_head_sha:
                type: string
                description: SHA that the pull request head must match for the enqueued merge to proceed.
              bypass_rules:
                type: boolean
                default: false
                description: Whether the asynchronous merge request will attempt to bypass repository rules that the authenticated actor is permitted to bypass.
            required:
            - message
            - uuid
            - merge_method
            - merge_action
            - expected_head_sha
          - description: When the pull request is in a merge queue
            type: object
            additionalProperties: false
            properties:
              message:
                type: string
            required:
            - message
          - description: When the asynchronous merge request failed
            type: object
            additionalProperties: false
            properties:
              message:
                type: string
            required:
            - message
          - description: When the pull request has been merged
            type: object
            additionalProperties: false
            properties:
              message:
                type: string
              sha:
                type: string
            required:
            - message
            - sha
      required:
      - status
      - details
