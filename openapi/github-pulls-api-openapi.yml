              schema:
                $ref: '#/components/schemas/pull-request-merge-async-result'
              examples:
                direct-merge:
                  summary: Direct merge request accepted
                  value:
                    status: pending
                    details:
                      message: Merge request enqueued.
                      uuid: 630b9d5e-3f2a-4f7e-8b0c-2d5f9a8c1e42
                      merge_method: squash
                      merge_action: direct_merge
                      expected_head_sha: 6358cd125586d9def8c3e5943f23506202da81cc
                merge-queue:
