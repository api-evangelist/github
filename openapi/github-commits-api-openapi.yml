  /repos/{owner}/{repo}/statuses/{sha}:
    post:
      summary: GitHub Create Commit Status
      description: 'Users with push access in a repository can create commit statuses for a given SHA.


        Note: there is a limit of 1000 statuses per `sha` and `context` within a repository. Attempts to create more than 1000 statuses will result in a validation error.'
      tags:
      - Commits
      operationId: createCommitStatus
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/enterprise-server@3.9/rest/commits/statuses#create-a-commit-status
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      - name: sha
        in: path
        required: true
        schema:
          type: string
        x-multi-segment: true
        example: abc123def456789012345678901234567890
      - in: header
        name: Authorization
        schema:
          type: string
        example: example_value
      - in: header
        name: X-GitHub-Api-Version
        schema:
          type: string
          default: '2022-11-28'
        example: example_value
      - in: header
        name: Accept
        schema:
          type: string
          default: application/vnd.github+json
        example: example_value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                  description: The state of the status.
                  enum:
                  - error
                  - failure
                  - pending
                  - success
                target_url:
                  type: string
                  description: 'The target URL to associate with this status. This URL will be linked from the GitHub UI to allow users to easily see the source of the status.

                    For example, if your continuous integration system is posting build status, you would want to provide the deep link for the build output for this specific SHA:

                    `http://ci.example.com/user/repo/build/sha`'
                description:
                  type: string
                  description: short description of the status.
                context:
                  type: string
                  description: string label to differentiate this status from the status of other systems. This field is case-insensitive.
                  default: default
              required:
              - state
            examples:
              default:
                value:
                  state: success
                  target_url: https://example.com/build/status
                  description: The build succeeded!
                  context: continuous-integration/jenkins
      responses:
        '201':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/status'
              examples:
                default:
                  $ref: '#/components/examples/status'
          headers:
            Location:
              example: https://api.github.com/repos/octocat/Hello-World/statuses/6dcb09b5b57875f334f61aebed695e2e4193db5e
              schema:
                type: string
