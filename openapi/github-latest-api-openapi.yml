      - id
      - name
      - content_type
      - size
      - state
      - url
      - node_id
      - download_count
      - label
      - uploader
      - browser_download_url
      - created_at
      - updated_at
    release:
      title: Release
      description: release.
      type: object
      properties:
        url:
          type: string
          format: uri
          example: https://api.github.com/repos/octocat/Hello-World
        html_url:
          type: string
          format: uri
          example: https://api.github.com/repos/octocat/Hello-World
        assets_url:
          type: string
          format: uri
          example: https://api.github.com/repos/octocat/Hello-World
        upload_url:
          type: string
          example: https://api.github.com/repos/octocat/Hello-World
        tarball_url:
          type: string
          format: uri
          example: https://api.github.com/repos/octocat/Hello-World
        zipball_url:
          type: string
          format: uri
          example: https://api.github.com/repos/octocat/Hello-World
        id:
          type: integer
          example: 42
        node_id:
          type: string
          example: '12345678'
        tag_name:
          description: The name of the tag.
          example: v1.0.0
          type: string
        target_commitish:
          description: Specifies the commitish value that determines where the Git tag is created from.
          example: master
          type: string
        name:
          type: string
          example: octocat
        body:
          type: string
          example: Example body text
        draft:
          description: true to create a draft (unpublished) release, false to create a published one.
          example: false
          type: boolean
        prerelease:
          description: Whether to identify the release as a prerelease or a full release.
          example: false
          type: boolean
        created_at:
          type: string
          format: date-time
          example: '2026-04-17T12:00:00Z'
        published_at:
          type: string
          format: date-time
          example: '2026-04-17T12:00:00Z'
        author:
          $ref: '#/components/schemas/simple-user'
        assets:
          type: array
          items:
            $ref: '#/components/schemas/release-asset'
        body_html:
          type: string
          example: Example body text
        body_text:
          type: string
          example: Example body text
        mentions_count:
          type: integer
        reactions:
          $ref: '#/components/schemas/reaction-rollup'
      required:
      - assets_url
      - upload_url
      - tarball_url
      - zipball_url
      - created_at
      - published_at
      - draft
      - id
      - node_id
      - author
      - html_url
      - name
      - prerelease
      - tag_name
      - target_commitish
      - assets
      - url
