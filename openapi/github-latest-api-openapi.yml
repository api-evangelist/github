    release-asset:
      title: Release Asset
      description: Data related to a release.
      type: object
      properties:
        url:
          type: string
          format: uri
          example: https://api.github.com/repos/octocat/Hello-World
        browser_download_url:
          type: string
          format: uri
          example: https://api.github.com/repos/octocat/Hello-World
        id:
          type: integer
          example: 42
        node_id:
          type: string
          example: '12345678'
        name:
          description: The file name of the asset.
          type: string
          example: Team Environment
        label:
          type: string
          example: Example Title
        state:
          description: State of the release asset.
          type: string
          enum:
          - uploaded
          - open
          example: uploaded
        content_type:
          type: string
          example: User
        size:
          type: integer
          example: 42
        download_count:
          type: integer
          example: 42
        created_at:
          type: string
          format: date-time
          example: '2026-04-17T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-04-17T12:00:00Z'
        uploader:
          $ref: '#/components/schemas/nullable-simple-user'
