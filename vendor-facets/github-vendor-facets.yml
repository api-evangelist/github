    Publish the apis.yml on the Pages site (github.io or a custom domain) and set its url: to that address.
    Under 0.22.0 github.io is not a catalog host, so it passes; github.com and raw.githubusercontent.com
    do not.
  catalog_pass_rate: 0.06
  facet: discoverability
  points: 4
  baseline_pass_rate: 0.047
  cohort_pct: 1.9
  control_pct: 4.8
  delta_pp: -2.9
earns_nothing:
- feature: org-default-health-files
  check: os_security_policy
  why: >-
    GitHub serves org-default files as fallbacks, but they do not appear in the product repository, and
    the harvest reads that repository's own root listing and community profile. A SECURITY.md kept only
    in the .github repo scores nothing.
- feature: repository-hosting
  check: apis_json_self_hosted
  why: >-
    An apis.yml whose url is on github.com or raw.githubusercontent.com is on a code-hosting platform,
    not a host the provider controls; the check refuses it.
- feature: repository-hosting
  check: contract_present
  why: >-
    Hosting a file is not authoring it. The contract earns because the provider wrote it; putting it in
    a repository changes where it is read from, not whether it counts.
- feature: github-mcp-server
  check: mcp_server
  layer: agent_readiness
  why: It exposes GitHub's API, not the provider's. No provider earns mcp_server because GitHub runs one.
- feature: discussions
  check: webhooks_advertised
  why: Discussions has announcements and polls, not an event surface for the provider's API.
out_of_reach:
  checks:
  - contract_present
  - sdk_count_1
  - status_page_present
  - rate_limits_documented
  - plans_present
  note: >-
    GitHub hosts and organizes what a provider already makes; it cannot create an API contract, SDKs,
    a status page, rate limits or plans.
unscored_practice:
- feature: security-advisories
  why: >-
    Published advisories with CVE ids are a strong disclosure signal and no check reads them; only the
    SECURITY.md or a declared pointer counts.
- feature: org-default-health-files
  why: >-
    An organization-wide SECURITY default is real governance practice the open_source harvest cannot see
    (it reads the product repository's own root).
