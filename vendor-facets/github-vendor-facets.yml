  catalog_pass_rate: 0.175
  facet: regulatory
  points: 6
  baseline_pass_rate: 0.336
  cohort_pct: 31.5
  control_pct: 33.7
  delta_pp: -2.2
- feature: contributing
  check: os_contribution_guide
  layer: composite
  conditional: true
  condition: >-
    Only for an open-source product repository the harvest reads; keep the file in that repository itself
