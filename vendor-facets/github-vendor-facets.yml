# Vendor facets — GitHub (Discussions, Pages, the organization and its repositories).
# The one developer-community vendor with a real profile: nearly every pointer check it moves is
# one the provider must DECLARE, and two of them (Discussions as Community, the org as
# GitHubOrganization) grade at half credit today because the pointer probe never reads those types.
# The open_source rows only apply to a provider whose PRODUCT is an open-source repository, and a
# SECURITY.md earns os_security_policy only when it sits at that repository's root.
vendor: github
name: GitHub
website: https://github.com
areas:
- community
- hosting
registry_keys:
- github-discussions
- github-pages
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: measured
summary: >-
  GitHub moves more Kin Score checks than any other community vendor, but almost all of them are pointers
  the provider has to declare in its apis.yml, and two land at half credit: a Discussions forum declared
  as Community and an organization declared as GitHubOrganization both grade "unverified" (0.5) because
  the pointer probe does not read either type. The four open_source checks (releases, SECURITY.md, CONTRIBUTING,
  CODE_OF_CONDUCT) are real but conditional: that facet applies only when the provider's product is itself
  an open-source repository we harvest (668 of ~26,700 providers), and an organization-default SECURITY.md
  kept only in a .github repo is invisible to it. Hosting an OpenAPI or apis.yml in a repository earns
  nothing by itself; serving the apis.yml from a Pages site does.
features:
- id: discussions
  name: GitHub Discussions (repository and organization)
  description: >-
    A public forum attached to a repository or an organization, with Q&A categories, marked answers, announcements
    and polls.
  source: >-
    https://docs.github.com/en/discussions/collaborating-with-your-community-using-discussions/about-discussions
  tier: all
- id: organization
  name: Organization account with public repositories
  description: >-
    A public home for a provider's repositories, and the place organization-wide defaults such as community
    health files live.
  source: >-
    https://docs.github.com/en/communities/setting-up-your-project-for-healthy-contributions/creating-a-default-community-health-file
  tier: all
- id: releases
  name: Releases with release notes
  description: >-
    Tagged, downloadable versions of a repository with hand-written or automatically generated release
    notes and a release-only subscription.
  source: https://docs.github.com/en/repositories/releasing-projects-on-github/about-releases
  tier: all
- id: security-policy
  name: SECURITY.md security policy
  description: >-
    A file telling researchers which versions are supported and how to report a vulnerability, surfaced
    on the repository's security tab.
  source: https://docs.github.com/en/code-security/getting-started/adding-a-security-policy-to-your-repository
  tier: all
- id: private-vulnerability-reporting
  name: Private vulnerability reporting
  description: >-
    A structured private form for researchers to report a vulnerability in a public repository, enableable
    per repository or across an organization.
  source: >-
    https://docs.github.com/en/code-security/security-advisories/working-with-repository-security-advisories/configuring-private-vulnerability-reporting-for-a-repository
  tier: all
- id: security-advisories
  name: Repository security advisories and CVE issuance
  description: Draft, fix privately and publish advisories, with GitHub acting as CVE Numbering Authority.
  source: >-
    https://docs.github.com/en/code-security/security-advisories/working-with-repository-security-advisories/about-repository-security-advisories
  tier: all
- id: contributing
  name: CONTRIBUTING guide
  description: A community health file stating how to contribute, linked from issues and pull requests.
  source: >-
    https://docs.github.com/en/communities/setting-up-your-project-for-healthy-contributions/creating-a-default-community-health-file
  tier: all
- id: code-of-conduct
  name: CODE_OF_CONDUCT
  description: A community health file stating the engagement standards for a project.
  source: >-
    https://docs.github.com/en/communities/setting-up-your-project-for-healthy-contributions/creating-a-default-community-health-file
  tier: all
- id: org-default-health-files
  name: Organization-default community health files (.github repository)
  description: >-
    CONTRIBUTING, CODE_OF_CONDUCT, SECURITY and SUPPORT files kept once in a public .github repository
    and used as fallbacks by every repository that lacks its own.
  source: >-
    https://docs.github.com/en/communities/setting-up-your-project-for-healthy-contributions/creating-a-default-community-health-file
  tier: all
- id: projects-roadmap
  name: Public Projects with a roadmap layout
  description: >-
    A project board that can be set public and viewed as a table, a kanban board or a timeline-style roadmap.
  source: >-
    https://docs.github.com/en/issues/planning-and-tracking-with-projects/managing-your-project/managing-visibility-of-your-projects
  tier: all
- id: pages-site
  name: GitHub Pages static hosting
  description: Static site hosting straight from a repository, on github.io or a custom domain.
  source: https://docs.github.com/en/pages/getting-started-with-github-pages/what-is-github-pages
  tier: all
- id: pages-jekyll-blog
  name: Jekyll blog posts on Pages
  description: Dated Markdown posts in a _posts directory built into a blog by the Pages Jekyll pipeline.
  source: >-
    https://docs.github.com/en/pages/setting-up-a-github-pages-site-with-jekyll/adding-content-to-your-github-pages-site-using-jekyll
  tier: all
- id: repository-hosting
  name: Public repositories (hosting an OpenAPI or apis.yml in a repo)
  description: Code, files and revision history, readable by anyone when the repository is public.
  source: https://docs.github.com/en/repositories/creating-and-managing-repositories/about-repositories
  tier: all
- id: github-mcp-server
  name: GitHub MCP Server
  description: >-
    GitHub's own MCP server, local or hosted at api.githubcopilot.com/mcp, exposing GitHub's repositories,
    issues and pull requests.
  source: https://github.com/github/github-mcp-server
  tier: all
maps:
- feature: discussions
  check: support_channel
  layer: composite
  credit: 0.5
  provider_must: >-
    Declare the Discussions URL in apis.yml common[]. Declared as Community it grades "unverified" (0.5)
    because probe-pointers.py does not probe the Community type; declared as Support (or a SUPPORT.md
    declared as Support) it is probed and earns 1.0 when live.
  note: >-
    Measured 2026-09-25: 195 providers whose only support-class pointer is Community all score support_channel
    partial with "pointer liveness 0.5". Discussions URLs that were probed (typed Support) came back 30
    live, 1 dead, 1 unreachable of 32. The discount is a probe-scope gap, not a rubric rule.
  catalog_pass_rate: 0.45
  facet: developer_ergonomics
  points: 2
  baseline_pass_rate: 0.69
  cohort_pct: 66.7
  control_pct: 69.0
  delta_pp: -2.3
- feature: organization
  check: github_org_present
  layer: composite
  credit: 0.5
  provider_must: Declare the organization URL in apis.yml common[] as GitHubOrganization.
  note: >-
    GitHubOrganization is not in the pointer probe's type list, so it grades "unverified" (0.5) for almost
    everyone: 9,603 of 9,636 GitHubOrganization pointers in pointer-liveness.json.
  catalog_pass_rate: 0.081
  facet: operational_transparency
  points: 2
  baseline_pass_rate: 0.425
  cohort_pct: 50.0
  control_pct: 42.4
  delta_pp: 7.6
- feature: releases
  check: os_releases
  layer: composite
  conditional: true
  condition: >-
    Only when the provider's product is itself an open-source repository the open-source harvest reads
