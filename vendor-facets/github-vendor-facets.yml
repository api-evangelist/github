  catalog_pass_rate: 0.115
  facet: operational_transparency
  points: 4
  baseline_pass_rate: 0.269
  cohort_pct: 35.2
  control_pct: 26.8
  delta_pp: 8.4
- feature: private-vulnerability-reporting
