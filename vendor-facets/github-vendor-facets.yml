  catalog_pass_rate: 0.656
  facet: open_source
  points: 10
  baseline_pass_rate: 0.731
  cohort_pct: 83.3
  control_pct: 72.9
  delta_pp: 10.4
- feature: code-of-conduct
  check: os_code_of_conduct
  layer: composite
  conditional: true
  condition: >-
    Only for an open-source product repository the harvest reads; keep the file in that repository itself
